<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifreyi Yenile - Halı Saha</title>
    <!-- Modern Türkçe karakter destekli font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- İkonlar için Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet" />
    <style>
        :root {
            /* Tema Renkleri */
            --bg-color: #0F1712;
            /* Sayfa Geneli Koyu Arka Plan */
            --card-bg: #132A1C;
            /* Kart Arka Planı (Görseldeki Koyu Gri/Yeşil ton) */
            --primary: #2EED7B;
            /* Neon Yeşil Detaylar */
            --text-white: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.6);
            --input-bg: rgba(255, 255, 255, 0.05);
            /* Yarı saydam beyaz input */
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            display: flex;
            align-items: center;
            /* Dikey ortalama */
            justify-content: center;
            /* Yatay ortalama */
            min-height: 100vh;
            padding: 24px;
        }

        /* En Dış Kart Kabı */
        .card-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 440px;
            /* Görseldeki gibi mobilde tam genişlik, masaüstünde kart görünümü */
            border-radius: 20px;
            padding: 48px 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            /* Derinlik */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo Alanı (Futbol Topu) */
        .logo-circle {
            width: 72px;
            height: 72px;
            background-color: rgba(46, 237, 123, 0.1);
            /* Transparan açık yeşil */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .logo-circle .material-symbols-outlined {
            color: var(--primary);
            font-size: 36px;
        }

        /* Metinler */
        .title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        /* Form Grupları */
        .form-group {
            width: 100%;
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-white);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            padding-right: 48px;
            /* Göz ikonuna yer bırak */
            color: var(--text-white);
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background-color: rgba(255, 255, 255, 0.08);
            /* Odaklanınca hafif aydınlat */
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            /* Görseldeki nokta placeholder'lar */
            letter-spacing: 2px;
        }

        /* Şifre Göster/Gizle Butonu */
        .eye-btn {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s;
        }

        .eye-btn:hover {
            color: var(--text-white);
        }

        .eye-btn .material-symbols-outlined {
            font-size: 22px;
        }

        /* Gereksinimler Kutusu */
        .requirements-box {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.2);
            /* Kart içindeki koyu kutu */
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 32px;
            border: 1px solid var(--border-color);
        }

        .req-item {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
            /* Varsayılan renk soluk */
            margin-bottom: 12px;
            transition: color 0.3s ease;
        }

        .req-item:last-child {
            margin-bottom: 0;
        }

        .req-icon {
            font-size: 16px;
            margin-right: 12px;
            color: rgba(255, 255, 255, 0.3);
            /* Gri Tık */
            transition: color 0.3s ease;
        }

        /* Gereksinim Sağlandığında Aktif Sınıfı */
        .req-item.active {
            color: var(--text-white);
            /* Metin aydınlanır */
        }

        .req-item.active .req-icon {
            color: var(--primary);
            /* İkon yeşil olur */
        }

        /* Şifreyi Yenile Butonu */
        .submit-btn {
            width: 100%;
            background-color: var(--primary);
            color: #000;
            /* Görseldeki siyah metin */
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: not-allowed;
            /* Başlangıçta pasif */
            opacity: 0.5;
            /* Başlangıçta soluk */
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 0 rgba(46, 237, 123, 0);
            /* Varsayılan gölge yok */
        }

        /* Tüm şartlar sağlandığında buton aktifleşir */
        .submit-btn.enabled {
            opacity: 1;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(46, 237, 123, 0.25);
            /* Glow Efekti */
        }

        .submit-btn.enabled:active {
            transform: scale(0.98);
        }

        /* Kullanıcıya dönülecek mesajlar (Hata/Başarı) */
        .status-msg {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            display: none;
            /* Başlangıçta gizli */
        }

        .status-msg.error {
            display: block;
            background-color: rgba(255, 77, 77, 0.1);
            color: #ff4d4d;
            border: 1px solid rgba(255, 77, 77, 0.3);
        }

        .status-msg.success {
            display: block;
            background-color: rgba(46, 237, 123, 0.1);
            color: var(--primary);
            border: 1px solid rgba(46, 237, 123, 0.3);
        }

        /* Loader Animasyonu (Dönüş) */
        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid #000;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Mobil Ekran Kontrolleri */
        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .card-container {
                padding: 40px 20px;
                border: none;
                box-shadow: none;
                /* Mobilde fazladan gölgeye gerek yok */
            }
        }
    </style>
</head>

<body>

    <div class="card-container">
        <!-- İkon -->
        <div class="logo-circle">
            <span class="material-symbols-outlined">sports_soccer</span>
        </div>

        <h1 class="title">Yeni Şifre Belirleyin</h1>
        <p class="subtitle">Hesabınızı güvende tutmak için güçlü bir şifre seçin.</p>

        <!-- Yeni Şifre -->
        <div class="form-group">
            <label for="newPass">Yeni Şifre</label>
            <div class="input-wrapper">
                <input type="password" id="newPass" placeholder="••••••••" spellcheck="false">
                <button type="button" class="eye-btn" onclick="togglePassword('newPass', this)"
                    aria-label="Şifreyi Göster">
                    <span class="material-symbols-outlined">visibility</span>
                </button>
            </div>
        </div>

        <!-- Yeni Şifre Tekrar -->
        <div class="form-group">
            <label for="confirmPass">Yeni Şifre (Tekrar)</label>
            <div class="input-wrapper">
                <input type="password" id="confirmPass" placeholder="••••••••" spellcheck="false">
                <button type="button" class="eye-btn" onclick="togglePassword('confirmPass', this)"
                    aria-label="Şifreyi Göster">
                    <span class="material-symbols-outlined">visibility</span>
                </button>
            </div>
        </div>

        <!-- Kontrol Listesi -->
        <div class="requirements-box">
            <div class="req-item" id="req-charCount">
                <span class="material-symbols-outlined req-icon">check_circle</span>
                En az 8 karakter
            </div>
            <div class="req-item" id="req-complex">
                <span class="material-symbols-outlined req-icon">check_circle</span>
                En az bir büyük harf ve bir rakam
            </div>
            <div class="req-item" id="req-match">
                <span class="material-symbols-outlined req-icon">check_circle</span>
                Şifreler aynı olmalı
            </div>
        </div>

        <button id="submitBtn" class="submit-btn" disabled>Şifreyi Yenile</button>

        <div id="statusMessage" class="status-msg"></div>
    </div>

    <!-- Mantık & İşleyiş (JavaScript) -->
    <script>
        // DOM Elementleri
        const passInput = document.getElementById('newPass');
        const confirmInput = document.getElementById('confirmPass');
        const btn = document.getElementById('submitBtn');
        const statusBox = document.getElementById('statusMessage');

        // Gereksinim Satırları
        const reqCharCount = document.getElementById('req-charCount');
        const reqComplex = document.getElementById('req-complex');
        const reqMatch = document.getElementById('req-match');

        // GÖSTER/GİZLE MANTIĞI
        function togglePassword(inputId, btnEl) {
            const input = document.getElementById(inputId);
            const icon = btnEl.querySelector('span');

            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off'; // Üstü çizili göz
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';     // Normal göz
            }
        }

        // ŞİFRE BİLGİSİNİ DOĞRULAMA (HER HARF YAZILDIĞINDA ÇALIŞIR)
        function valiateForm() {
            const pwd = passInput.value;
            const confirmPwd = confirmInput.value;

            // Kural 1: En az 8 karakter
            const isLong = pwd.length >= 8;
            if (isLong) reqCharCount.classList.add('active');
            else reqCharCount.classList.remove('active');

            // Kural 2: 1 Büyük Harf [A-Z] ve 1 Rakam [0-9] barındırma (Regex)
            // ^(?=.*[A-Z]) : En az 1 büyük harf (Türkçe karakterler için ekleme yapıldı)
            // (?=.*[0-9])  : En az 1 rakam
            const hasUpperAndNumber = /(?=.*[A-ZÇĞİÖŞÜ])(?=.*[0-9])/.test(pwd);
            if (hasUpperAndNumber && pwd.length > 0) reqComplex.classList.add('active');
            else reqComplex.classList.remove('active');

            // Kural 3: Şifrelerin Birbirini Tutması
            const isMatching = (pwd === confirmPwd) && (pwd.length > 0);
            if (isMatching) reqMatch.classList.add('active');
            else reqMatch.classList.remove('active');

            // EĞER HER ŞEY TAMAMSA BUTONU AÇ
            if (isLong && hasUpperAndNumber && isMatching) {
                btn.removeAttribute('disabled');
                btn.classList.add('enabled');
            } else {
                btn.setAttribute('disabled', 'true');
                btn.classList.remove('enabled');
            }
        }

        passInput.addEventListener('input', valiateForm);
        confirmInput.addEventListener('input', valiateForm);

        // URL'den Firebase'in 'oobCode'unu çekme fonksiyonu
        function getParameterByName(name) {
            const url = window.location.href;
            name = name.replace(/[\[\]]/g, '\\$&');
            const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
            const results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }

        // ARAYÜZE MESAJ BASMA FONKSİYONU
        function showFeedback(message, type) {
            statusBox.textContent = message;
            statusBox.className = 'status-msg ' + type; // type: error / success
        }

        // TIKLAMA VE AĞ İSTEĞİ
        btn.addEventListener('click', async () => {
            // Güvenlik amacıyla disable kontrolü
            if (btn.hasAttribute('disabled')) return;

            // Gerçek projede authController apiKey veya get config üzerinden alırız.
            // Bu örnekte REST API yapısı kullanılmıştır.
            // BURAYA FIREBASE API KEYINIZI YAZINIZ.
            const WEB_API_KEY = "AIzaSyDBbmrBTlxj-7CPaZnk0sHX-JEiTfIG6HM";
            const oobCode = getParameterByName('oobCode');

            if (!oobCode) {
                showFeedback("Link geçersiz veya süresi dolmuş. Lütfen uygulamadan tekrar şifre sıfırlama isteyin.", "error");
                return;
            }

            const newPassword = passInput.value;

            // Yükleniyor durumuna geçir
            btn.innerHTML = '<span class="loader"></span>';
            btn.setAttribute('disabled', 'true');
            btn.classList.remove('enabled');

            try {
                // Firebase Auth Rest API çağrısı
                const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:resetPassword?key=${WEB_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        oobCode: oobCode,
                        newPassword: newPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showFeedback("Harika! Şifreniz başarıyla güncellendi. Artık güvenle giriş yapabilirsiniz.", "success");
                    btn.innerHTML = 'Şifreyi Yenile';
                    btn.style.display = 'none'; // Tamamlandıktan sonra butonu gizle (isteğe bağlı)
                } else {
                    showFeedback(data.error.message || "İşlem sırasında bir hata oluştu.", "error");
                    btn.innerHTML = 'Şifreyi Yenile';
                    btn.removeAttribute('disabled');
                    btn.classList.add('enabled');
                }

            } catch (err) {
                showFeedback("Lütfen internet bağlantınızı kontrol edip tekrar deneyin.", "error");
                btn.innerHTML = 'Şifreyi Yenile';
                btn.removeAttribute('disabled');
                btn.classList.add('enabled');
            }
        });

    </script>
</body>

</html>
