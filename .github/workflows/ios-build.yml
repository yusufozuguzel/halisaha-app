name: Build iOS IPA

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v4

      - name: ⚙️ Flutter'ı kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Paketleri indir
        run: flutter pub get

      - name: 🧹 Temizlik ve iOS 15.0 Manipülasyonu
        run: |
          rm -f ios/Podfile
          rm -f ios/Podfile.lock
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/Runner.xcodeproj/project.pbxproj

      - name: 🍏 Sertifikasız iOS Archive (Kasa) Oluştur
        # Hata verse bile (imza olmadığı için) süreci durdurma, arşivi oluşturup devam et!
        continue-on-error: true
        run: flutter build ipa --release --no-codesign

      - name: 📦 Kasanın İçinden App Dosyasını Çıkar ve IPA Yap
        run: |
          mkdir -p Payload
          mv build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r -9 app.ipa Payload/

      - name: 🚀 IPA Dosyasını İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app.ipa
