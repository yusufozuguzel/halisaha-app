name: Build iOS IPA

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Flutter'ı kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Paketleri indir
        run: flutter pub get

      - name: Sertifikasız iOS Build Al
        run: flutter build ios --release --no-codesign

      - name: Çıktıyı IPA Formatına Çevir
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r -9 app.ipa Payload/

      - name: IPA Dosyasını İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app.ipa
