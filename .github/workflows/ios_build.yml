name: iOS build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Configure native iOS Maps key
        shell: bash
        env:
          IOS_MAPS_API_KEY: ${{ secrets.IOS_MAPS_API_KEY }}
        run: |
          if [[ -n "$IOS_MAPS_API_KEY" ]]; then
            if [[ ! "$IOS_MAPS_API_KEY" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo 'IOS_MAPS_API_KEY must contain only key characters.' >&2
              exit 1
            fi
            printf 'MAPS_API_KEY=%s\n' "$IOS_MAPS_API_KEY" > ios/Flutter/Secrets.xcconfig
          fi
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check iOS configuration
        run: python3 tool/check_ios_configuration.py
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Build unsigned iOS app for compile verification
        run: flutter build ios --release --no-codesign
      - name: Upload unsigned app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app-build-check
          path: build/ios/iphoneos/Runner.app/
          if-no-files-found: error
