name: Build iOS IPA

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v4

      - name: ⚙️ Flutter'ı kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Paketleri indir
        run: flutter pub get

      - name: 🧹 Temizlik ve iOS 14.0 Manipülasyonu
        # Podfile hatasından kurtulmak için en temiz yöntem (Eski dosyayı sil, pbxproj'u 14.0'a hackle)
        run: |
          rm -f ios/Podfile
          rm -f ios/Podfile.lock
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g' ios/Runner.xcodeproj/project.pbxproj

      - name: 🍏 Sertifikasız iOS Build Al
        run: flutter build ios --release --no-codesign

      - name: 📦 Çıktıyı IPA Formatına Çevir
        # Emir'in harika eklentisi: .app klasörünü manuel olarak IPA'ya dönüştürüyor
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r -9 app.ipa Payload/

      - name: 🚀 IPA Dosyasını İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app.ipa
